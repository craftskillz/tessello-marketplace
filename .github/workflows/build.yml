# At each merge, builds index.json, its assets and the Marketplace site with Tessello's Index Generator.
# Deploying the site is a later step; until then the site is kept as an artifact of the run.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the pinned Tessello commit
        id: pin
        run: echo "commit=$(tr -d '[:space:]' < .github/tessello-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out Tessello's tools
        uses: actions/checkout@v4
        with:
          repository: craftskillz/tessello
          ref: ${{ steps.pin.outputs.commit }}
          path: .tessello
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Tessello's tools
        working-directory: .tessello
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The Host's address for the "Install in Tessello" links: the repository variable TESSELLO_HOST, if set.
      - name: Build the index and the site
        env:
          TESSELLO_HOST: ${{ vars.TESSELLO_HOST || 'https://tessello.pages.dev/' }}
        run: node .tessello/packages/marketplace/scripts/build-site.ts --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/site" --host "$TESSELLO_HOST"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
