# At each merge, builds index.json, its assets and the Marketplace site with Tessello's Index Generator, then deploys it
# to the Cloudflare Pages project tessello-marketplace, served at https://tessello-marketplace.pages.dev/.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the pinned Tessello commit
        id: pin
        run: echo "commit=$(tr -d '[:space:]' < .github/tessello-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out Tessello's tools
        uses: actions/checkout@v7
        with:
          repository: craftskillz/tessello
          ref: ${{ steps.pin.outputs.commit }}
          path: .tessello
          persist-credentials: false

      # No dependency cache: a cache shared with pull_request_target runs could be poisoned.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Tessello's tools
        working-directory: .tessello
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The Host's address for the "Install in Tessello" links: the repository variable TESSELLO_HOST, if set.
      - name: Build the index and the site
        env:
          TESSELLO_HOST: ${{ vars.TESSELLO_HOST || 'https://tessello.pages.dev/' }}
        run: node .tessello/packages/marketplace/scripts/build-site.ts --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/site" --host "$TESSELLO_HOST"

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ runner.temp }}/site

  # A job of its own, so the Cloudflare token never meets the job that installed Tessello's tools. It waits for the
  # repository variable CLOUDFLARE_ACCOUNT_ID: until the Maintainer sets it, the site stays an artifact of the run.
  deploy:
    needs: build
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 pages deploy site --project-name tessello-marketplace --branch main --commit-hash "$GITHUB_SHA"
